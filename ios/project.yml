name: OrynodeMobileAI
options:
  bundleIdPrefix: ai.orynode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# LiteRT-LM is a local path package (not remote exactVersion).
# Bootstrap pin: ios/scripts/bootstrap-litertlm.sh → tag v0.15.0
packages:
  LiteRTLM:
    path: .tools/LiteRT-LM
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.3
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  OrynodeDomain:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Domain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.orynode.mobile.domain
        GENERATE_INFOPLIST_FILE: true

  OrynodeApplication:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Application
    dependencies:
      - target: OrynodeDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.orynode.mobile.application
        GENERATE_INFOPLIST_FILE: true

  OrynodeInfrastructure:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Infrastructure
    dependencies:
      - target: OrynodeDomain
      - sdk: libsqlite3.tbd
      - sdk: PDFKit.framework
      - sdk: UIKit.framework
      - sdk: Accelerate.framework
      - sdk: CoreML.framework
      - sdk: Vision.framework
      - sdk: UniformTypeIdentifiers.framework
      - package: SwiftTransformers
        product: Tokenizers
      - package: SwiftTransformers
        product: Hub
      - package: LiteRTLM
        product: LiteRTLM
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.orynode.mobile.infrastructure
        GENERATE_INFOPLIST_FILE: true

  OrynodeMobileAI:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Features
      - path: Sources/Resources/Assets.xcassets
      - path: Sources/Resources/Embedding
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
        type: file
    dependencies:
      - target: OrynodeDomain
      - target: OrynodeApplication
      - target: OrynodeInfrastructure
      # LiteRTLM wraps a dynamic binary target. The final app must depend on
      # the product directly so Xcode embeds CLiteRTLM.framework.
      - package: LiteRTLM
        product: LiteRTLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.orynode.mobile
        PRODUCT_NAME: OrynodeMobileAI
        # 与 ios/CHANGELOG.md 同步；发版时先改这里再记 Changelog
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Build script must read SRCROOT embedding assets; sandbox blocks that.
        ENABLE_USER_SCRIPT_SANDBOXING: false
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Orynode AI
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    preBuildScripts:
      - name: Validate bundled embedding assets
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # Inline (not a nested script) so User Script Sandboxing cannot block exec.
          if [ "${CONFIGURATION:-Debug}" != "Release" ]; then
            exit 0
          fi
          ASSETS="${SRCROOT}/Sources/Resources/Embedding"
          MODEL="$ASSETS/multilingual-e5-small.mlmodelc"
          TOKENIZER="$ASSETS/multilingual-e5-small-tokenizer"
          if [ ! -d "$MODEL" ] || [ ! -f "$TOKENIZER/tokenizer.json" ] || [ ! -f "$TOKENIZER/tokenizer_config.json" ]; then
            echo "error: Release requires bundled multilingual-e5-small Core ML and tokenizer assets."
            echo "error: Run ios/scripts/prepare-embedding-model.sh before archiving."
            exit 1
          fi

  OrynodeMobileAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OrynodeMobileAI
      - target: OrynodeDomain
      - target: OrynodeApplication
      - target: OrynodeInfrastructure
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.orynode.mobile.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  OrynodeMobileAI:
    build:
      targets:
        OrynodeMobileAI: all
    test:
      targets:
        - OrynodeMobileAITests
