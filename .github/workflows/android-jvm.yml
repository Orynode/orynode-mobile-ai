name: Android unit tests

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-jvm.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-jvm.yml"

# Covers :domain / :application / :infrastructure (Robolectric) unit tests only.
# Does NOT claim device offline gates — see android/docs/verification.md.
jobs:
  test:
    name: domain / application / infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # :infrastructure is an Android library with Robolectric — JDK alone is not enough.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :domain:test :application:test :infrastructure:test --no-daemon
